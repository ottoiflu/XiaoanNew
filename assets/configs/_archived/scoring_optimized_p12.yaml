# 针对 p12 误差模式优化的评分配置
# 角度权重 0.25→0.40（让角度违规在 threshold=0.60 时可触发失败）
# 距离"基本合规-压线"给 0.5（缓解距离过严导致的 FN）
# 距离权重 0.40→0.30（降低距离维度惩罚力度）

score_map:
  composition:
    "[合规]": 1.0
    "[基本合规]": 0.7
    "[不合规-构图]": 0.0
    "[不合规-无参照]": 0.0
  angle:
    "[合规]": 1.0
    "[不合规-角度]": 0.0
  distance:
    "[完全合规]": 1.0
    "[基本合规-压线]": 0.5
    "[不合规-超界]": 0.0
  context:
    "[合规]": 1.0
    "[不合规-环境]": 0.0

weights:
  composition: 0.05
  angle: 0.40
  distance: 0.30
  context: 0.25

threshold: 0.60
composition_gate: true
